<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Control | HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <div id="login-view" class="admin-container">
        <h1>HQ: Security Area</h1>
        <p class="subtitle" style="margin-bottom: 30px;">Authorized Personnel Only</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="admin-email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-password" required>
            </div>
            <button type="submit" class="submit-btn">Authorize Access</button>
        </form>
        <p id="login-error" style="color: #ef4444; font-size: 0.875rem; margin-top: 15px; text-align: center; display: none;"></p>
        
        <div class="admin-footer">
            <a href="index.html">← Return to Storefront</a>
        </div>
    </div>

    <div id="dashboard-view" class="admin-dashboard hidden">
        <div class="dashboard-header">
            <div>
                <h1>HQ: Drop Control</h1>
                <p class="subtitle">Manage the Game Gears catalog</p>
            </div>
            <button id="logout-btn" class="logout-btn">Lock Down (Logout)</button>
        </div>
        
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h2 class="card-title">Push New Drop</h2>
                <div id="success-message" class="success-msg hidden">Kit live on storefront!</div>
                
                <form id="add-kit-form">
                    <div class="form-group">
                        <label>Jersey Name</label>
                        <input type="text" id="kit-name" placeholder="e.g., Chelsea 12/13 Home" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Price (₦)</label>
                        <input type="number" id="kit-price" placeholder="45000" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Kit Image</label>
                        <input type="file" id="kit-image" accept="image/*" required style="padding: 10px;">
                    </div>
                    <button type="submit" class="submit-btn">Deploy to Store</button>
                </form>
            </div>

            <div class="dashboard-card">
                <h2 class="card-title">Live Inventory</h2>
                <div id="admin-inventory-list" class="inventory-list">
                    <p style="text-align: center; color: #9CA3AF; padding: 20px;">Loading catalog...</p>
                </div>
            </div>
        </div>

        <div class="admin-footer">
            <a href="index.html">← Return to Storefront</a>
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
